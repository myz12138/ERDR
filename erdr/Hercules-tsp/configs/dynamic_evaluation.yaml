paths:
  repo_root: "."
  baseline_solver: "erdr/Hercules-tsp/outputs/hercules_baseline/best_solver.py"
  erdr_solver: "erdr/Hercules-tsp/outputs/hercules_erdr/best_solver.py"
  base_pkl: "data_generate/TSP200_u50/TSP200_u50_concorde.pkl"
  run_root: "erdr/Hercules-tsp/data/dynamic_evaluation_runs"
  run_name: ""
  dataset_prefix: ""

dynamic_evaluation:
  method: "baseline"
  change_types: "location_change,request_arrival,request_cancellation"
  n_instance: 50
  n_instance_eval: 0
  seed: 20260528
  ratio_sets: "0.2,0.5,0.8"

evaluation:
  metric_basis: "gap"  # gap | cost
  group_evaluation_mode: "mean_only"
  tail_risk_basis: "gap"

gls:
  time_limit_per_instance: 60.0
  iter_limit: 500
  perturbation_moves: 2
  gap_eps: 1.0e-12

generation:
  jitter_sigma: 0.02
  node_frac: 0.2
  concorde_scale: 10000
