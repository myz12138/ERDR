llm:
  llm_api_endpoint: ""
  llm_api_key: ""
  llm_model: "gpt-6-luna"
  llm_temperature: 1.0

paths:
  train_pkl: "data_generate/TSP200_u50/TSP200_u50_concorde.pkl"
  output_dir: "erdr/Hercules-tsp/outputs/hercules_erdr"

method:
  backbone: "hercules"
  variant: "erdr"

hercules:
  max_fe: 50
  pop_size: 4
  init_pop_size: 10
  mutation_rate: 0.5
  diversify_init_pop: true

evaluation:
  problem_config: "tsp_gls_erdr"
  problem_size: 200
  mode: "erdr"
  metric_basis: "gap"
  group_evaluation_mode: "mean_variability_tail"
  tail_risk_basis: "time"
  n_instance_eval: 50
  gls_time_limit_per_instance: 60.0
  gls_ite_max: 500
  gls_perturbation_moves: 2
  gap_eps: 1.0e-12
  archive_top_k: 10
  erdr:
    enabled: true
    group_size: 5
    n_groups_total: 10
    n_groups_train: 5
    n_groups_val: 5
    split_seed: 20260528
    val_interval: 1
    train_pool_multiplier: 2
    dds_eps_rel: 0.001
    dds_softmax_tau: 0.7
    dds_novelty_weight: 0.02

exp:
  output_mode: "minimal"
  keep_top_k_solvers: 10
